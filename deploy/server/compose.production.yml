x-application-environment: &application-environment
  JD_IMAGE_DATABASE_URL: postgresql://${JD_IMAGE_POSTGRES_USER:?JD_IMAGE_POSTGRES_USER is required}:${JD_IMAGE_POSTGRES_PASSWORD:?JD_IMAGE_POSTGRES_PASSWORD is required}@postgres:5432/${JD_IMAGE_POSTGRES_DB:?JD_IMAGE_POSTGRES_DB is required}
  JD_IMAGE_DATA_ROOT: /srv/jd-image-data
  JD_IMAGE_MASTER_KEY: ${JD_IMAGE_MASTER_KEY:?JD_IMAGE_MASTER_KEY is required}
  JD_IMAGE_DATABASE_CONNECT_TIMEOUT_SECONDS: ${JD_IMAGE_DATABASE_CONNECT_TIMEOUT_SECONDS:-2}
  JD_IMAGE_WORKER_HEARTBEAT_INTERVAL_SECONDS: ${JD_IMAGE_WORKER_HEARTBEAT_INTERVAL_SECONDS:-2}
  JD_IMAGE_WORKER_HEARTBEAT_TTL_SECONDS: ${JD_IMAGE_WORKER_HEARTBEAT_TTL_SECONDS:-10}
  HTTP_PROXY: ""
  HTTPS_PROXY: ""
  ALL_PROXY: ""
  NO_PROXY: ""
  http_proxy: ""
  https_proxy: ""
  all_proxy: ""
  no_proxy: ""

x-service-logging: &service-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

services:
  postgres:
    image: ${JD_IMAGE_POSTGRES_IMAGE:?JD_IMAGE_POSTGRES_IMAGE is required}
    platform: linux/amd64
    restart: unless-stopped
    stop_grace_period: 1m
    environment:
      POSTGRES_DB: ${JD_IMAGE_POSTGRES_DB:?JD_IMAGE_POSTGRES_DB is required}
      POSTGRES_USER: ${JD_IMAGE_POSTGRES_USER:?JD_IMAGE_POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${JD_IMAGE_POSTGRES_PASSWORD:?JD_IMAGE_POSTGRES_PASSWORD is required}
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - type: bind
        source: ${JD_IMAGE_POSTGRES_DIR:?JD_IMAGE_POSTGRES_DIR is required}
        target: /var/lib/postgresql/data
    logging: *service-logging

  web:
    image: ${JD_IMAGE_APP_IMAGE:?JD_IMAGE_APP_IMAGE is required}
    platform: linux/amd64
    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    environment: *application-environment
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/health/live', timeout=2).read()
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - type: bind
        source: ${JD_IMAGE_DATA_DIR:?JD_IMAGE_DATA_DIR is required}
        target: /srv/jd-image-data
      - type: bind
        source: ${JD_IMAGE_BACKUP_DIR:?JD_IMAGE_BACKUP_DIR is required}
        target: /srv/jd-image-backups
    logging: *service-logging

  worker:
    image: ${JD_IMAGE_APP_IMAGE:?JD_IMAGE_APP_IMAGE is required}
    platform: linux/amd64
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - python
      - -m
      - codex_image.server.worker
    environment: *application-environment
    volumes:
      - type: bind
        source: ${JD_IMAGE_DATA_DIR:?JD_IMAGE_DATA_DIR is required}
        target: /srv/jd-image-data
    logging: *service-logging

  proxy:
    image: ${JD_IMAGE_NGINX_IMAGE:?JD_IMAGE_NGINX_IMAGE is required}
    platform: linux/amd64
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    ports:
      - ${JD_IMAGE_HTTP_BIND:-0.0.0.0}:${JD_IMAGE_HTTP_PORT:-8787}:80
    volumes:
      - type: bind
        source: ./nginx.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
    logging: *service-logging
